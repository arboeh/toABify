name: HACS

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS structure
        uses: hacs/repository-validator@v2
        with:
          category: integration
          github_token: ${{ secrets.GITHUB_TOKEN }}
