notify:
  name: Send Toast Notification
  description: >
    Send a toast notification to the frontend via WebSocket. Notifications appear as
    toast messages in the Home Assistant UI and can include buttons, icons, and
    callbacks for user interaction.

    To send a notification:
      notify.toabify:
        message: "Your message here"
        data:
          duration: 5000  # ms before auto-dismiss
          position: right  # left, right, or center
          gravity: top  # top, bottom, or center
          color: info  # success, info, warning, error, alert, default
          visibility: dashboard  # all or dashboard
          button_label: "CLOSE"
          close: false
          onClick:
            action: "light.toggle"
            action_data:
              entity_id: "light.living_room"
          callback: "https://example.com"
